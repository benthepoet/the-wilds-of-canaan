<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>The Wilds of Canaan</title>
    <style>
        body { background: #000; color: #ccc; margin: 0; font-family: monospace;
               display: flex; height: 100vh; overflow: hidden; }
        #game { flex: 1; display: block; }
        #sidebar { width: 200px; background: #111; padding: 10px; flex-shrink: 0; }
        #sidebar div { margin: 4px 0; }
        #log { position: fixed; bottom: 0; left: 0; width: calc(100% - 220px);
               height: 70px; background: #111; padding: 6px; overflow-y: auto;
               font-size: 12px; border-top: 1px solid #333; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="sidebar">
        <div><b>THE WILDS OF CANAAN</b></div>
        <div>Seed: <span id="seed">?</span></div>
        <div id="stats"></div>
    </div>
    <div id="log"></div>
    <script src="game.js"></script>
</body>
</html>
