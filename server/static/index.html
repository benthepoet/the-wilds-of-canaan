<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>The Wilds of Canaan</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0a0a0a; color: #bbb; margin: 0;
            font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        /* Everything is in normal flow: map left, sidebar right, log below.
           Nothing overlays the map, so the player can never be hidden. */
        #main { flex: 1; display: flex; min-height: 0; }
        #mapwrap { flex: 1; min-width: 0; padding: 8px; }
        #game { display: block; width: 100%; height: 100%; }
        #sidebar {
            width: 200px; flex-shrink: 0; margin: 8px 8px 8px 0; padding: 10px;
            background: #111; border: 1px solid #222; border-radius: 3px;
            font-size: 12px; line-height: 1.6; overflow-y: auto;
        }
        #sidebar .title { color: #ffd700; font-weight: bold; }
        #log {
            height: 72px; flex-shrink: 0; margin: 0 8px 8px; padding: 6px 8px;
            background: #111; border: 1px solid #222; border-radius: 3px;
            font-size: 12px; overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="mapwrap"><canvas id="game"></canvas></div>
        <div id="sidebar">
            <div class="title">THE WILDS OF CANAAN</div>
            <div>Seed: <span id="seed">?</span></div>
            <div id="stats"></div>
        </div>
    </div>
    <div id="log"></div>
    <script src="game.js"></script>
</body>
</html>
